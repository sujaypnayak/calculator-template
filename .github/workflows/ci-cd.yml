name: Calculator CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and inspect code
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest black bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: pytest tests/ -v

      - name: Check formatting
        run: black --check src/ tests/

      - name: Run security scan
        run: bandit -r src/

  package:
    name: Package validated calculator
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Create deployment package
        shell: bash
        run: |
          mkdir calculator-package
          cp -r src calculator-package/
          cp README.md requirements.txt calculator-package/
          zip -r calculator-package.zip calculator-package

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: calculator-package
          path: calculator-package.zip