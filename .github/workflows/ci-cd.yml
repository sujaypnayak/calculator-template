name: CI/CD pipeline

on: 
  workflow_dispatch: # Only runs manually if you trigger it

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder step
        run: echo "This is an empty pipeline. Nothing runs on push or PR."name: Calculator CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and inspect code
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Check formatting
        run: black src/ tests/ 

      - name: Run security scan
        run: bandit -r src/

  package:
    name: Package validated calculator
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Create deployment package
        shell: bash
        run: |
          mkdir calculator-package
          cp -r src calculator-package/
          cp README.md requirements.txt calculator-package/
          zip -r calculator-package.zip calculator-package

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: calculator-package
          path: calculator-package.zip